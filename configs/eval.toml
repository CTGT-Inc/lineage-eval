schema_version = 1
run_id = "eval"

[benchmark]
files = [
  "../data/benchmark/finance_prompts.jsonl",
  "../data/benchmark/core_political_matched_prompts.jsonl",
]

[generation]
# The user owns the inference server. `--model` and `--base-url` can override
# these placeholders without editing this file.
base_url = "http://127.0.0.1:8000/v1"
model_keys = ["model-under-test"]
output = "../runs/eval/responses.jsonl"
metadata = "../runs/eval/run.json"
temperature = 0.0
top_p = 1.0
max_tokens = 4096
seed = 0
concurrency = 16

[judging]
output_dir = "../runs/eval/judgments"
rubric = "v2"
concurrency = 8
poll_interval_seconds = 60

[[judging.judges]]
key = "grok"
transport = "openrouter"
model = "x-ai/grok-4.20"
max_tokens = 2048
reasoning = true
parse_retries = 1

[[judging.judges]]
key = "gemini"
transport = "openrouter"
model = "google/gemini-3.5-flash"
max_tokens = 2048
reasoning = true
parse_retries = 1

[[judging.judges]]
key = "gpt"
transport = "openai-batch"
model = "openai/gpt-5-mini"
api_model = "gpt-5-mini"
max_tokens = 2048
reasoning = true
reasoning_effort = "medium"
parse_retries = 1

[[judging.judges]]
key = "sonnet"
transport = "anthropic-batch"
model = "anthropic/claude-sonnet-4.6"
api_model = "claude-sonnet-4-6"
max_tokens = 2048
reasoning = true
parse_retries = 1

[analysis]
output_dir = "../runs/eval/analysis"
